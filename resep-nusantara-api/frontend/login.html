<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Resep Nusantara</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login" class="login-page">
  <div class="login-card">
    <h1 class="login-title">Resep Nusantara</h1>
    <p class="login-subtitle" id="auth-subtitle">Masuk ke dashboard untuk mengelola akses API</p>

    <div class="auth-toggle" id="auth-toggle">
      <button type="button" class="auth-toggle-btn active" data-mode="login">Login</button>
      <button type="button" class="auth-toggle-btn" data-mode="register">Daftar</button>
    </div>

    <div id="login-error" class="error-box" hidden></div>

    <form id="login-form" novalidate>
      <div class="form-group" id="name-group" hidden>
        <label for="login-name">Nama</label>
        <input type="text" id="login-name" name="name" autocomplete="name" />
      </div>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <div class="password-field">
          <input type="password" id="login-password" name="password" autocomplete="current-password" required />
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Tampilkan password" aria-pressed="false">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.7 20.7 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.64 20.64 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" id="login-submit" class="btn-primary">Login</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
