<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Resep Nusantara</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login" class="login-page">
  <div class="login-card">
    <h1 class="login-title">Resep Nusantara</h1>
    <p class="login-subtitle">Masuk ke dashboard untuk mengelola akses API</p>

    <div id="login-error" class="error-box" hidden></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" id="login-submit" class="btn-primary">Login</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
